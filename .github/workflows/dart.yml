name: dart

on:
  push:
    branches: [develop]

  pull_request:
    branches: [develop]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: stable
      - run: dart pub get
      - run: dart test
      - run: dart analyze
